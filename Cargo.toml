[workspace]
resolver = "2"

members = [
    "crates/sectorkit",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["userFRM"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/userFRM/sectorkit"
documentation = "https://docs.rs/sectorkit"

[workspace.dependencies]
# -- Core --
anyhow = "1.0.102"
thiserror = "2.0.18"

# -- Async runtime --
tokio = { version = "1.52.1", features = ["full"] }

# -- Serialization --
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# -- Logging --
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# -- Time --
chrono = { version = "0.4.44", features = ["serde"] }

# -- HTTP --
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
bytes = "1.11.1"
futures = "0.3.32"

# -- Parquet / Arrow --
arrow = { version = "58.1.0", default-features = false }
parquet = { version = "58.1.0", default-features = false, features = ["snap", "zstd", "arrow"] }

# -- CLI --
clap = { version = "4.6.1", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
