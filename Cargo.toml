[workspace]
resolver = "2"

members = [
    "crates/sectorkit",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["userFRM"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/userFRM/sectorkit"
documentation = "https://docs.rs/sectorkit"

[workspace.dependencies]
# -- Core --
anyhow = "1"
thiserror = "2"

# -- Async runtime --
tokio = { version = "1", features = ["full"] }

# -- Serialization --
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# -- Logging --
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# -- Time --
chrono = { version = "0.4", features = ["serde"] }

# -- HTTP --
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
bytes = "1"
futures = "0.3"

# -- Parquet / Arrow --
arrow = { version = "58", default-features = false }
parquet = { version = "58", default-features = false, features = ["snap", "zstd", "arrow"] }

# -- CLI --
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
